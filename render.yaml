services:
  - type: web
    name: gandy-house-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://jordandav-is.github.io
      - key: DATA_FILE
        value: /var/lib/gandybnb/gandybnb.sqlite
    disk:
      name: gandy-house-data
      mountPath: /var/lib/gandybnb
      sizeGB: 1
